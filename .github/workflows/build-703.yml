name: Build SupraHex 703 + Discord factory image

on:
  workflow_dispatch:
  push:
    branches: [supra-hex-703-discord]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
      - name: Build web dist
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build && python tools/test_ca_bundle.py --build-dir build
          path: '.'
      - name: esp-idf build factory config for 703
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: /opt/esp/idf/components/nvs_flash/nvs_partition_generator/nvs_partition_gen.py generate config-703.cvs config.bin 0x6000
          path: '.'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install esptool
      - name: Create factory image
        run: ./merge_bin.sh -c esp-miner-factory-703-discord-v2.15.4.bin
      - name: Create update image
        run: ./merge_bin.sh -u esp-miner-update-703-discord-v2.15.4.bin
      - uses: actions/upload-artifact@v4
        with:
          name: supra703-discord-v2.15.4
          path: |
            esp-miner-factory-703-discord-v2.15.4.bin
            esp-miner-update-703-discord-v2.15.4.bin
            build/esp-miner.bin
      - name: Publish images to branch built-703-discord
        run: |
          mkdir -p /tmp/out
          cp esp-miner-factory-703-discord-v2.15.4.bin esp-miner-update-703-discord-v2.15.4.bin build/esp-miner.bin /tmp/out/
          cd /tmp/out && git init -q -b built-703-discord
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "703 discord v2.15.4 images from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" built-703-discord

  decode-tls-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Look up TLS error 0x3000 in the IDF mbedtls/esp-tls headers
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: "echo MARK-BEGIN; grep -rn -i -E '0x3000' /opt/esp/idf/components/mbedtls /opt/esp/idf/components/esp-tls /opt/esp/idf/components/esp_http_client --include=*.h 2>/dev/null | head -40; echo MARK-MBEDTLS-VER; grep -rn 'MBEDTLS_VERSION_STRING ' /opt/esp/idf/components/mbedtls --include=*.h | head -3; echo MARK-END"
          path: '.'
